name: Fetch Native Libraries

on:
  workflow_dispatch:

jobs:
  download-libs:
    name: Download KissFFT and Whisper.cpp
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download and Extract Libraries
        run: |
          echo "Creating third_party directory..."
          mkdir -p app/src/main/cpp/third_party
          cd app/src/main/cpp/third_party

          # הורדה וחילוץ של KissFFT (עדכון כתובת מדויקת לטאג)
          echo "Downloading KissFFT..."
          curl -L https://github.com/mborgerding/kissfft/archive/refs/tags/131.1.0.tar.gz -o kissfft.tar.gz
          tar -xzf kissfft.tar.gz
          mv kissfft-131.1.0 kissfft
          rm kissfft.tar.gz

          # הורדה וחילוץ של Whisper.cpp
          echo "Downloading Whisper.cpp..."
          curl -L https://github.com/ggerganov/whisper.cpp/archive/refs/heads/master.zip -o whisper.zip
          unzip -q whisper.zip
          mv whisper.cpp-master whisper.cpp
          rm whisper.zip

          echo "Libraries downloaded successfully into third_party!"

      - name: Commit and Push Libraries to Repository
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          git add app/src/main/cpp/third_party/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Add KissFFT and Whisper.cpp libraries automatically" && git push)
