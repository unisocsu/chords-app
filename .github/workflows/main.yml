name: Build Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build APK with NDK & CMake
    runs-on: ubuntu-latest

    steps:
      # 1. משיכת הקוד מהריפוזיטורי
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. הגדרת סביבת Java (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. הגדרת Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. התקנת Gradle 8.7 באופן מובנה על השרת
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 5. בניית קובץ ה-APK (Debug) ישירות עם Gradle 8.7
      - name: Build Debug APK with Gradle
        run: gradle assembleDebug

      # 6. העלאת קובץ ה-APK שנוצר כארטיפקט להורדה
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
