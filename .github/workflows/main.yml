name: Build Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build APK with NDK & CMake
    runs-on: ubuntu-latest

    steps:
      # 1. משיכת הקוד מהריפוזיטורי
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. הגדרת סביבת Java (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. הגדרת Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. יצירת ה-Gradle Wrapper עם גרסה 8.7 התואמת לאנדרואיד
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      # 5. מתן הרשאות הרצה ל-gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 6. בניית קובץ ה-APK (Debug)
      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug

      # 7. העלאת קובץ ה-APK שנוצר כארטיפקט להורדה
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
