name: Android Build & Package APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # מאפשר להריץ את ה-Build גם ידנית מתוך GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. שיבוט קוד המקור מה-Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. הגדרת סביבת Java (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. קיבוע גרסת Gradle ל-8.7 (מונע מעבר ל-Gradle 9 ושומר על תאימות)
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 4. הרצת בניית ה-APK (Debug)
      - name: Build Debug APK
        run: gradle assembleDebug

      # 5. העלאת קובץ ה-APK כ-Artifact להורדה בלשונית Actions
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ChordsApp-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
