name: Build Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build APK with NDK & CMake
    runs-on: ubuntu-latest

    steps:
      # 1. משיכת קוד הפרויקט מ-GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. הגדרת סביבת Java (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. מתן הרשאות הרצה לסקריפט ה-Gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. התקנת Android SDK ו-NDK הנדרשים לקומפילציית C++
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. בניית קובץ ה-APK (Debug) כולל קישוריות ה-C++
      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug

      # 6. העלאת קובץ ה-APK שנוצר כארטיפקט להורדה ב-GitHub Actions
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
